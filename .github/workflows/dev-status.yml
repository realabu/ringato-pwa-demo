name: Ringató Dev Status · hourly Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/implementation-plan/**"
      - "ringato-dev/**"
      - "wordpress-plugins/**"
      - "src/**"
      - "apps/**"
      - "packages/**"
      - "scripts/dev_status.py"
      - "scripts/test_dev_status.py"
      - "docs/dev-status/**"
      - ".github/workflows/dev-status.yml"
  schedule:
    # GitHub Actions cron is UTC, and execution may be delayed.
    - cron: "17 * * * *"

concurrency:
  group: "ringato-dev-status-pages"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Generate status snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout primary development repository (public, read only)
        id: devcheckout
        uses: actions/checkout@v4
        with:
          repository: nmarton/ringato-dev
          # Fine-grained token with Contents: read for the development repo.
          # GITHUB_TOKEN cannot read a private repository in another account.
          token: ${{ secrets.RINGATO_DEV_READ_TOKEN || github.token }}
          path: _sources/ringato-dev
          fetch-depth: 0
          persist-credentials: false
        continue-on-error: true
      - name: Verify generator behavior
        run: python3 -m unittest discover -s scripts -p 'test_dev_status.py'
      - name: Generate factual metrics from both pinned checkouts
        if: steps.devcheckout.outcome == 'success'
        run: python3 scripts/dev_status.py --dev-repo _sources/ringato-dev
      - name: Publish transparent unavailable-source snapshot
        if: steps.devcheckout.outcome != 'success'
        run: |
          python3 - <<'PY'
          import datetime, json, pathlib
          from scripts.dev_status import ROOT, LABELS, measure, tracked, plan_ready_count
          plan = plan_ready_count()
          demo = measure(ROOT, [p for p in tracked(ROOT) if p in {'app.html','index.html','app.js','v13.js','sw.js'}])
          data = {
              'schema': 2,
              'generated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
              'source_unavailable': True,
              'completed': None,
              'plan_completed': plan,
              'total': 14,
              'milestones': [
                  {'id': f'MF{i:02d}', 'name': name,
                   'state': 'A tervben ellenőrzésre kész' if i <= plan else 'Fejlesztői állapot nem ellenőrizhető'}
                  for i, name in enumerate(LABELS, 1)
              ],
              'metrics': {'prototype_lines': demo['lines'], 'prototype_file_count': demo['files']},
              'progress_events': [],
              'notes': [
                  'A nmarton/ringato-dev nem hozzáférhető a GitHub Actions számára. A forráskód, az MF05+ mérföldkövek és a kódsorstatisztikák most nem ellenőrizhetők.',
                  'A terv szerinti érték nem a tényleges fejlesztési készültség. Nem állítunk stagnálást vagy hiányzó fejlesztést.'
              ],
              'links': {
                  'repo': 'https://github.com/nmarton/ringato-dev',
                  'plan': 'https://github.com/realabu/ringato-pwa-demo/blob/main/docs/implementation-plan/10-inkrementalis-merfoldkovek.md'
              }
          }
          pathlib.Path('docs/dev-status/status.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\\n')
          PY
      - name: Prepare static Pages artifact
        run: |
          mkdir -p _site/dev-status
          cp index.html app.html app.js v13.js sw.js icon.svg manifest.webmanifest virag-terv.html _site/
          cp docs/dev-status/index.html docs/dev-status/status.json _site/dev-status/
          touch _site/.nojekyll
          python3 -m json.tool _site/dev-status/status.json > /dev/null
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v4
