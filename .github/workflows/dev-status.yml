name: Ringató Dev Status · hourly Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/implementation-plan/**"
      - "ringato-dev/**"
      - "wordpress-plugins/**"
      - "src/**"
      - "apps/**"
      - "packages/**"
      - "scripts/dev_status.py"
      - "scripts/test_dev_status.py"
      - "docs/dev-status/**"
      - "docs/ideas/**"
      - "AGENTS.md"
      - "scripts/build_ideas.py"
      - "scripts/test_build_ideas.py"
      - ".github/workflows/dev-status.yml"
  schedule:
    # GitHub Actions cron is UTC, and execution may be delayed.
    - cron: "17 * * * *"

concurrency:
  group: "ringato-dev-status-pages"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Generate status snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check private source credential availability
        env:
          SOURCE_TOKEN: ${{ secrets.RINGATO_DEV_READ_TOKEN }}
        run: |
          if [ -n "$SOURCE_TOKEN" ]; then
            echo "HAS_DEV_TOKEN=true" >> "$GITHUB_ENV"
          else
            echo "HAS_DEV_TOKEN=false" >> "$GITHUB_ENV"
            echo "::warning::RINGATO_DEV_READ_TOKEN is missing; publish last verified snapshot with a visible refresh warning."
          fi
      - name: Checkout primary development repository (private, read only)
        id: development
        if: env.HAS_DEV_TOKEN == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: nmarton/ringato-dev
          token: ${{ secrets.RINGATO_DEV_READ_TOKEN }}
          path: _sources/ringato-dev
          fetch-depth: 0
          persist-credentials: false
      - name: Verify generator behavior
        run: python3 -m unittest discover -s scripts -p 'test_dev_status.py'
      - name: Generate factual metrics from both pinned checkouts
        if: steps.development.outcome == 'success'
        run: python3 scripts/dev_status.py --dev-repo _sources/ringato-dev
      - name: Preserve verified snapshot when private source is unavailable
        if: steps.development.outcome != 'success'
        run: python3 scripts/dev_status.py --fallback
      - name: Validate ideas catalog
        run: python3 -m unittest discover -s scripts -p 'test_build_ideas.py'
      - name: Generate ideas catalog
        run: python3 scripts/build_ideas.py --output docs/ideas/catalog.json
      - name: Prepare static Pages artifact
        run: |
          mkdir -p _site/dev-status _site/ideas
          cp docs/dev-status/index.html docs/dev-status/status.json _site/dev-status/
          cp docs/ideas/index.html docs/ideas/catalog.json _site/ideas/
          cp index.html app.html app.js v13.js sw.js icon.svg manifest.webmanifest virag-terv.html _site/
          touch _site/.nojekyll
          python3 -m json.tool _site/dev-status/status.json > /dev/null
          python3 -m json.tool _site/ideas/catalog.json > /dev/null
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v4
